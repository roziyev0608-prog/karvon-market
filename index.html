                    <span className="absolute -top-1 right-1 bg-emerald-400 text-slate-950 text-[8px] font-black w-3.5 h-3.5 rounded-full flex items-center justify-center">
                      {cart.reduce((a, c) => a + c.qty, 0)}
                    </span>
                  )}
                </button>
                <button onClick={() => setActiveTab("profile")} className={`flex flex-col items-center gap-0.5 text-[9px] font-bold ${activeTab === 'profile' ? 'text-emerald-400' : 'text-slate-400'}`}>
                  <i data-lucide="user" className="w-4 h-4"></i>
                  <span>{t("profile")}</span>
                </button>
              </div>

            </div>
          );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
