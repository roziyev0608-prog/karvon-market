              {}
              {isTrackCodeModalOpen && (
                <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4">
                  <div className="bg-slate-900 border border-slate-800 rounded-3xl w-full max-w-lg p-6 relative shadow-2xl">
                    <button onClick={() => setIsTrackCodeModalOpen(false)} className="absolute top-4 right-4 text-slate-400">✕</button>
                    <div className="flex items-center gap-3 mb-4">
                      <i data-lucide="truck" className="w-6 h-6 text-sky-400"></i>
                      <div>
                        <h3 className="text-base font-black text-slate-100">{t("trackCodeTitle")}</h3>
                        <p className="text-xs text-slate-400">Xitoy va Turkiyadan kelayotgan buyurtmangizni jonli kuzating</p>
                      </div>
                    </div>
                    <div className="flex gap-2 mb-4">
                      <input type="text" placeholder={t("trackCodePlaceholder")} value={trackCodeQuery} onChange={(e) => setTrackCodeQuery(e.target.value)} className="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white outline-none" />
                      <button onClick={() => setActiveTrackOrder({ code: trackCodeQuery || "KV-2026-1723", origin: "Xitoy (Shenzhen)", dest: "Toshkent sh." })} className="px-4 py-2 bg-sky-500 text-slate-950 font-black text-xs rounded-xl">Kuzatish</button>
                    </div>
                    {activeTrackOrder && (
                      <div className="bg-slate-950 p-4 rounded-2xl space-y-2 text-xs">
                        <div className="text-sky-400 font-bold">Trek: {activeTrackOrder.code}</div>
                        <div className="text-emerald-400 font-bold">✓ 1. Omborida qabul qilindi</div>
                        <div className="text-amber-400 font-bold">2. Bojxona va Xalqaro yo'lda (✈️)</div>
                        <div className="text-slate-500">3. Toshkent markaziy omborida</div>
                      </div>
                    )}
                  </div>
                </div>
              )}

              {}
              {isCartOpen && (
                <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-md flex justify-end">
                  <div className="bg-slate-900 border-l border-slate-800 w-full max-w-md h-full p-5 flex flex-col justify-between shadow-2xl">
                    <div>
                      <div className="flex items-center justify-between border-b border-slate-800 pb-4 mb-4">
                        <h3 className="text-base font-black text-slate-100 flex items-center gap-2">
                          <i data-lucide="shopping-cart" className="w-5 h-5 text-amber-400"></i> {t("cart")} ({cart.length})
                        </h3>
                        <button onClick={() => setIsCartOpen(false)} className="text-slate-400 hover:text-white">✕</button>
                      </div>

                      {cart.length === 0 ? (
                        <div className="py-16 text-center text-slate-400 text-xs">
                          <i data-lucide="shopping-cart" className="w-12 h-12 text-slate-700 mx-auto mb-2"></i>
                          <p>{t("emptyCart")}</p>
                        </div>
                      ) : (
                        <div className="space-y-3 max-h-[60vh] overflow-y-auto pr-1">
                          {cart.map(item => (
                            <div key={item.id} className="bg-slate-950 border border-slate-800 p-3 rounded-2xl flex items-center gap-3">
                              <img src={item.image} alt={item.title} className="w-14 h-14 object-cover rounded-xl" />
                              <div className="flex-1 min-w-0">
                                <h4 className="text-xs font-bold text-slate-200 truncate">{item.title}</h4>
                                <span className="text-xs font-black text-amber-400">{item.price.toLocaleString()} UZS</span>
                              </div>
                              <div className="flex items-center gap-1.5 bg-slate-900 p-1 rounded-xl border border-slate-800">
                                <button onClick={() => updateCartQty(item.id, -1)} className="w-6 h-6 flex items-center justify-center text-slate-300 hover:text-amber-400 font-bold">-</button>
                                <span className="text-xs font-bold w-4 text-center">{item.qty}</span>
                                <button onClick={() => updateCartQty(item.id, 1)} className="w-6 h-6 flex items-center justify-center text-slate-300 hover:text-amber-400 font-bold">+</button>
                              </div>
                              <button onClick={() => removeFromCart(item.id)} className="text-slate-500 hover:text-rose-400 p-1">✕</button>
                            </div>
                          ))}
                        </div>
                      )}
                    </div>

                    {cart.length > 0 && (
                      <div className="border-t border-slate-800 pt-4 space-y-3">
                        <div className="flex justify-between items-center text-sm font-black">
                          <span className="text-slate-400">{t("totalSum")}:</span>
                          <span className="text-amber-400 text-base">
                            {cart.reduce((a, c) => a + (c.price * c.qty), 0).toLocaleString()} UZS
                          </span>
                        </div>
                        <button
                          onClick={() => setIsCheckoutModalOpen(true)}
                          className="w-full py-3 bg-gradient-to-r from-amber-400 via-amber-500 to-orange-500 text-slate-950 font-black text-xs rounded-xl shadow-lg"
                        >
                          {t("checkoutBtn")} 💳
                        </button>
                      </div>
                    )}
                  </div>
                </div>
              )}

              {}
              {isCheckoutModalOpen && (
                <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4">
                  <div className="bg-slate-900 border border-slate-800 rounded-3xl w-full max-w-md p-6 relative shadow-2xl">
                    <button onClick={() => setIsCheckoutModalOpen(false)} className="absolute top-4 right-4 text-slate-400">✕</button>
                    
                    <h3 className="text-base font-black text-slate-100 mb-4 flex items-center gap-2">
                      <i data-lucide="check-circle" className="w-5 h-5 text-emerald-400"></i>
                      <span>Buyurtmani Tasdiqlash</span>
                    </h3>

                    <form onSubmit={handleCompleteOrderSubmit} className="space-y-4">
                      <div>
                        <label className="text-[11px] font-bold text-slate-400 block mb-1">Yetkazib berish manzili</label>
                        <input
                          type="text"
                          value={checkoutAddress}
                          onChange={(e) => setCheckoutAddress(e.target.value)}
                          className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-white outline-none focus:border-amber-500"
                          required
                        />
                      </div>

                      <div>
                        <label className="text-[11px] font-bold text-slate-400 block mb-1">To'lov Usuli</label>
                        <select
                          value={checkoutPaymentMethod}
                          onChange={(e) => setCheckoutPaymentMethod(e.target.value)}
                          className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-white outline-none"
                        >
                          <option value="click">Click / Payme (Online)</option>
                          <option value="nasiya">0% Nasiya (3 oyga bo'lib to'lash)</option>
                          <option value="cash">Kuryerga Naqd yoki Karta orqali</option>
                        </select>
                      </div>

                      <div className="bg-slate-950 p-3.5 rounded-2xl border border-slate-800 text-xs space-y-1">
                        <div className="flex justify-between text-slate-400">
                          <span>Mahsulotlar soni:</span>
                          <span className="font-bold text-slate-200">{cart.reduce((a, c) => a + c.qty, 0)} dona</span>
                        </div>
                        <div className="flex justify-between text-slate-400">
                          <span>Yetkazib berish (Express):</span>
                          <span className="font-bold text-emerald-400">BEPUL 🚚</span>
                        </div>
                        <div className="flex justify-between text-amber-400 font-black pt-1 border-t border-slate-800 text-sm">
                          <span>Jami Summa:</span>
                          <span>{cart.reduce((a, c) => a + (c.price * c.qty), 0).toLocaleString()} UZS</span>
                        </div>
                      </div>

                      <button
                        type="submit"
                        className="w-full py-3 bg-gradient-to-r from-emerald-400 via-emerald-500 to-teal-500 text-slate-950 font-black text-xs rounded-xl shadow-lg"
                      >
                        Tasdiqlash va Telegram Botga Yuborish 📦
                      </button>
                    </form>
                  </div>
                </div>
              )}

              {}
              <div className="fixed bottom-0 left-0 right-0 z-40 bg-[#0c1324]/95 backdrop-blur-xl border-t border-slate-800/80 md:hidden flex justify-around items-center py-2 px-1 shadow-2xl">
                <button onClick={() => setActiveTab("shop")} className={`flex flex-col items-center gap-0.5 text-[9px] font-bold ${activeTab === 'shop' ? 'text-amber-400' : 'text-slate-400'}`}>
                  <i data-lucide="shopping-bag" className="w-4 h-4"></i>
                  <span>{t("shop")}</span>
                </button>
                <button onClick={() => setActiveTab("categories")} className={`flex flex-col items-center gap-0.5 text-[9px] font-bold ${activeTab === 'categories' ? 'text-amber-400' : 'text-slate-400'}`}>
                  <i data-lucide="grid" className="w-4 h-4"></i>
                  <span>{t("categories")}</span>
                </button>
                <button onClick={() => setActiveTab("search")} className={`flex flex-col items-center gap-0.5 text-[9px] font-bold ${activeTab === 'search' ? 'text-amber-400' : 'text-slate-400'}`}>
                  <i data-lucide="search" className="w-4 h-4"></i>
                  <span>{t("searchNav")}</span>
                </button>
                <button onClick={() => setIsCartOpen(true)} className="flex flex-col items-center gap-0.5 text-[9px] font-bold text-slate-400 relative">
                  <i data-lucide="shopping-cart" className="w-4 h-4"></i>
                  <span>{t("cart")}</span>
                  {cart.length > 0 && (
                    <span className="absolute -top-1 right-1 bg-amber-400 text-slate-950 text-[8px] font-black w-3.5 h-3.5 rounded-full flex items-center justify-center">
                      {cart.reduce((a, c) => a + c.qty, 0)}
                    </span>
                  )}
                </button>
                <button onClick={() => setActiveTab("wishlist")} className={`flex flex-col items-center gap-0.5 text-[9px] font-bold relative ${activeTab === 'wishlist' ? 'text-amber-400' : 'text-slate-400'}`}>
                  <i data-lucide="heart" className="w-4 h-4"></i>
                  <span>{t("favorites")}</span>
                  {wishlist.length > 0 && (
                    <span className="absolute -top-1 right-1 bg-rose-500 text-white text-[8px] w-3.5 h-3.5 rounded-full flex items-center justify-center font-black">
                      {wishlist.length}
                    </span>
                  )}
                </button>
                <button onClick={() => setActiveTab("profile")} className={`flex flex-col items-center gap-0.5 text-[9px] font-bold ${activeTab === 'profile' ? 'text-amber-400' : 'text-slate-400'}`}>
                  <i data-lucide="user" className="w-4 h-4"></i>
                  <span>{t("profile")}</span>
                </button>
              </div>

            </div>
          );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
