              if (item.id === id) {

                                <div className="flex-1 min-w-0">
                                  <h5 className="text-xs font-bold text-slate-100 truncate">{p.title}</h5>
                                  <span className="text-xs font-black text-amber-400">{p.price.toLocaleString()} {t("currency")}</span>
                                </div>
                              </div>
                            ))}
                          </div>
                        )}
                      </div>
                    ))}
                    {isAiLoading && <div className="text-xs text-amber-400 font-bold">AI Qidirilmoqda...</div>}
                  </div>

                  <form onSubmit={(e) => { e.preventDefault(); handleSendAiMessage(); }} className="p-2.5 bg-slate-900 border-t border-slate-800 flex gap-1.5">
                    <input type="text" placeholder="Savolingizni yozing..." value={aiInput} onChange={(e) => setAiInput(e.target.value)} className="flex-1 bg-slate-950 text-xs text-slate-100 px-3 py-2 rounded-xl border border-slate-800 outline-none" />
                    <button type="submit" className="p-2 bg-amber-500 text-slate-950 font-bold rounded-xl">➤</button>
                  </form>
                </div>
              )}

              {isVisualSearchOpen && (
                <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4">
                  <div className="bg-slate-900 border border-slate-800 rounded-3xl w-full max-w-md p-6 relative shadow-2xl">
                    <button onClick={() => { setIsVisualSearchOpen(false); setUploadedImagePreview(null); }} className="absolute top-4 right-4 text-slate-400">✕</button>
                    
                    <div className="text-center mb-5">
                      <div className="w-14 h-14 rounded-2xl bg-gradient-to-tr from-amber-500 to-yellow-300 text-slate-950 flex items-center justify-center mx-auto mb-3 shadow-lg">
                        <i data-lucide="camera" className="w-7 h-7"></i>
                      </div>
                      <h3 className="text-base font-black text-slate-100">{t("visualSearchTitle")}</h3>
                      <p className="text-xs text-slate-400 mt-1">{t("visualSearchDesc")}</p>
                    </div>

                    <input 
                      type="file" 
                      accept="image/*" 
                      id="visual-file-input" 
                      className="hidden" 
                      onChange={handleImageUpload} 
                    />

                    {uploadedImagePreview ? (
                      <div className="mb-4 text-center">
                        <img src={uploadedImagePreview} alt="Preview" className="w-full h-48 object-cover rounded-2xl border border-amber-500/50 mb-2" />
                        <button onClick={() => setUploadedImagePreview(null)} className="text-xs font-bold text-rose-400 hover:underline">
                          ✕ Boshqa rasm tanlash
                        </button>
                      </div>
                    ) : (
                      <div 
                        onClick={() => document.getElementById('visual-file-input').click()}
                        className="border-2 border-dashed border-slate-700 hover:border-amber-500 rounded-2xl p-8 text-center cursor-pointer bg-slate-950/60 mb-4 transition-colors"
                      >
                        <i data-lucide="image-plus" className="w-8 h-8 text-amber-400 mx-auto mb-2"></i>
                        <p className="text-xs font-bold text-slate-300">Rasm yuklash yoki rasmga olish uchun bosing</p>
                        <span className="text-[10px] text-slate-500 block mt-1">PNG, JPG, WEBP (Max 10MB)</span>
                      </div>
                    )}

                    <button 
                      onClick={handleRunVisualSearch} 
                      disabled={isSearchingImage}
                      className="w-full py-3 bg-gradient-to-r from-amber-400 via-amber-500 to-orange-500 text-slate-950 font-black text-xs rounded-xl shadow-lg flex items-center justify-center gap-2"
                    >
                      {isSearchingImage ? (
                        <span>Rasm tahlil qilinmoqda... ⏳</span>
                      ) : (
                        <span>Katalogdan O'xshashini Topish 🔍</span>
                      )}
                    </button>
                  </div>
                </div>
              )}

              {isTrackCodeModalOpen && (
                <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4">
                  <div className="bg-slate-900 border border-slate-800 rounded-3xl w-full max-w-lg p-6 relative shadow-2xl">
                    <button onClick={() => setIsTrackCodeModalOpen(false)} className="absolute top-4 right-4 text-slate-400">✕</button>
                    <div className="flex items-center gap-3 mb-4">
                      <i data-lucide="truck" className="w-6 h-6 text-sky-400"></i>
                      <div>
                        <h3 className="text-base font-black text-slate-100">{t("trackCodeTitle")}</h3>
                        <p className="text-xs text-slate-400">Xitoy va Turkiyadan kelayotgan buyurtmangizni jonli kuzating</p>
                      </div>
                    </div>
                    <div className="flex gap-2 mb-4">
                      <input type="text" placeholder={t("trackCodePlaceholder")} value={trackCodeQuery} onChange={(e) => setTrackCodeQuery(e.target.value)} className="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white outline-none" />
                      <button onClick={() => setActiveTrackOrder({ code: trackCodeQuery || "KV-8923-CN", origin: "Xitoy (Shenzhen)", dest: "Toshkent sh." })} className="px-4 py-2 bg-sky-500 text-slate-950 font-black text-xs rounded-xl">Kuzatish</button>
                    </div>
                    {activeTrackOrder && (
                      <div className="bg-slate-950 p-4 rounded-2xl space-y-2 text-xs">
                        <div className="text-sky-400 font-bold">Trek: {activeTrackOrder.code}</div>
                        <div className="text-emerald-400 font-bold">✓ 1. Omborida qabul qilindi</div>
                        <div className="text-amber-400 font-bold">2. Bojxona va Xalqaro yo'lda (✈️)</div>
                        <div className="text-slate-500">3. Toshkent markaziy omborida</div>
                      </div>
                    )}
                  </div>
                </div>
              )}

              {isCargoCalcOpen && (
                <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4">
                  <div className="bg-slate-900 border border-slate-800 rounded-3xl w-full max-w-md p-6 relative shadow-2xl">
                    <button onClick={() => setIsCargoCalcOpen(false)} className="absolute top-4 right-4 text-slate-400">✕</button>
                    <h3 className="text-base font-black text-slate-100 mb-3">{t("cargoCalcTitle")}</h3>
                    <div className="space-y-3 mb-4 text-xs">
                      <div>
                        <label className="text-slate-400 block mb-1">Tovarning Narxi ($)</label>
                        <input type="number" value={itemPriceUsd} onChange={(e) => setItemPriceUsd(Number(e.target.value))} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white" />
                      </div>
                      <div>
                        <label className="text-slate-400 block mb-1">Vazni (Kg)</label>
                        <input type="number" step="0.1" value={cargoWeight} onChange={(e) => setCargoWeight(Number(e.target.value))} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white" />
                      </div>
                    </div>
                    <div className="bg-slate-950 p-4 rounded-2xl space-y-2 text-xs mb-4">
                      <div className="flex justify-between text-amber-400 font-bold">
                        <span>Sof Tan Narx:</span>
                        <span>{Math.round((itemPriceUsd + (cargoWeight * 6.5)) * 12800).toLocaleString()} so'm</span>
                      </div>
                      <div className="flex justify-between text-emerald-400 font-black">
                        <span>Sotuv Narxi (35% Margin):</span>
                        <span>{Math.round((itemPriceUsd + (cargoWeight * 6.5)) * 12800 * 1.35).toLocaleString()} so'm</span>
                      </div>
                    </div>
                    <button onClick={() => { showToast("Sotuv narxi hisoblandi!"); setIsCargoCalcOpen(false); }} className="w-full py-3 bg-amber-500 text-slate-950 font-black text-xs rounded-xl">Saqlash</button>
                  </div>
                </div>
              )}

              {selectedProduct && (
                <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4">
                  <div className="bg-slate-900 border border-slate-800 rounded-3xl w-full max-w-lg p-5 relative shadow-2xl max-h-[90vh] overflow-y-auto">
                    <button onClick={() => setSelectedProduct(null)} className="absolute top-4 right-4 text-slate-400 hover:text-white">✕</button>

                    <img src={selectedProduct.image} alt={selectedProduct.title} className="w-full h-64 object-cover rounded-2xl mb-4" />
                    
                    <div className="flex items-center gap-2 mb-2">
                      <span className="bg-amber-500/20 text-amber-400 border border-amber-500/30 text-[10px] font-bold px-2.5 py-0.5 rounded-full">
                        <i data-lucide="globe" className="w-3 h-3 inline mr-1"></i> {selectedProduct.originCountry}
                      </span>
                      <span className="bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 text-[10px] font-bold px-2.5 py-0.5 rounded-full">
                        <i data-lucide="credit-card" className="w-3 h-3 inline mr-1"></i> 0% Nasiya
                      </span>
                    </div>

                    <h3 className="text-base font-black text-slate-100 mb-2">{selectedProduct.title}</h3>
                    <p className="text-xs text-slate-300 leading-relaxed mb-4">{selectedProduct.description}</p>

                    <div className="bg-gradient-to-r from-purple-900/50 to-indigo-900/50 border border-purple-500/30 p-3.5 rounded-2xl mb-4 flex items-center justify-between">
                      <div>
                        <span className="text-xs font-bold text-amber-300 block">👥 Jamoaviy Xarid Narxi (-25% Chegirma):</span>
                        <span className="text-base font-black text-white">{Math.round(selectedProduct.price * 0.75).toLocaleString()} {t("currency")}</span>
                      </div>
                      <button
                        onClick={() => {
                          showToast("Jamoaviy xarid guruhi yaratildi! Havola nusxalandi 🔗");
                          addToCart({ ...selectedProduct, price: Math.round(selectedProduct.price * 0.75) });
                          setSelectedProduct(null);
                        }}
                        className="px-3.5 py-2 bg-gradient-to-r from-purple-600 to-indigo-600 text-white font-bold text-xs rounded-xl shadow"
                      >
                        Guruh Tuzish 👥
                      </button>
                    </div>

                    <div className="flex items-center justify-between pt-4 border-t border-slate-800">
                      <div>
                        <span className="text-xs text-slate-400 block">Oddiy Yakka Narx:</span>
                        <span className="text-lg font-black text-amber-400">{selectedProduct.price.toLocaleString()} {t("currency")}</span>
                      </div>

                      <button
                        onClick={() => {
                          addToCart(selectedProduct);
                          setSelectedProduct(null);
                        }}
                        className="px-5 py-2.5 bg-amber-500 text-slate-950 font-black text-xs rounded-xl shadow-md"
                      >
                        {t("addToCart")}
                      </button>
                    </div>
                  </div>
                </div>
              )}

              {isCartOpen && (
                <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-md flex justify-end">
                  <div className="bg-slate-900 border-l border-slate-800 w-full max-w-md h-full p-5 flex flex-col justify-between shadow-2xl">
                    <div>
                      <div className="flex items-center justify-between border-b border-slate-800 pb-4 mb-4">
                        <h3 className="text-base font-black text-slate-100 flex items-center gap-2">
                          <i data-lucide="shopping-cart" className="w-5 h-5 text-amber-400"></i> {t("cart")} ({cart.length})
                        </h3>
                        <button onClick={() => setIsCartOpen(false)} className="text-slate-400 hover:text-white">✕</button>
                      </div>

                      {cart.length === 0 ? (
                        <div className="py-16 text-center text-slate-400 text-xs">
                          <i data-lucide="shopping-cart" className="w-12 h-12 text-slate-700 mx-auto mb-2"></i>
                          <p>{t("emptyCart")}</p>
                        </div>
                      ) : (
                        <div className="space-y-3 max-h-[60vh] overflow-y-auto pr-1">
                          {cart.map(item => (
                            <div key={item.id} className="bg-slate-950 border border-slate-800 p-3 rounded-2xl flex items-center gap-3">
                              <img src={item.image} alt={item.title} className="w-14 h-14 object-cover rounded-xl" />
                              <div className="flex-1 min-w-0">
                                <h4 className="text-xs font-bold text-slate-200 truncate">{item.title}</h4>
                                <span className="text-xs font-black text-amber-400">{item.price.toLocaleString()} {t("currency")}</span>
                              </div>
                              <div className="flex items-center gap-1.5 bg-slate-900 p-1 rounded-xl border border-slate-800">
                                <button onClick={() => updateCartQty(item.id, -1)} className="w-6 h-6 flex items-center justify-center text-slate-300 hover:text-amber-400 font-bold">-</button>
                                <span className="text-xs font-bold w-4 text-center">{item.qty}</span>
                                <button onClick={() => updateCartQty(item.id, 1)} className="w-6 h-6 flex items-center justify-center text-slate-300 hover:text-amber-400 font-bold">+</button>
                              </div>
                              <button onClick={() => removeFromCart(item.id)} className="text-slate-500 hover:text-rose-400 p-1">✕</button>
                            </div>
                          ))}
                        </div>
                      )}
                    </div>

                    {cart.length > 0 && (
                      <div className="border-t border-slate-800 pt-4 space-y-3">
                        <div className="flex justify-between items-center text-sm font-black">
                          <span className="text-slate-400">{t("totalSum")}:</span>
                          <span className="text-amber-400 text-base">
                            {cart.reduce((a, c) => a + (c.price * c.qty), 0).toLocaleString()} {t("currency")}
                          </span>
                        </div>
                        <button
                          onClick={() => setIsCheckoutModalOpen(true)}
                          className="w-full py-3 bg-gradient-to-r from-amber-400 via-amber-500 to-orange-500 text-slate-950 font-black text-xs rounded-xl shadow-lg"
                        >
                          {t("checkoutBtn")} 💳
                        </button>
                      </div>
                    )}
                  </div>
                </div>
              )}

              {/* CHECKOUT MODAL */}
              {isCheckoutModalOpen && (
                <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4">
                  <div className="bg-slate-900 border border-slate-800 rounded-3xl w-full max-w-md p-6 relative shadow-2xl">
                    <button onClick={() => setIsCheckoutModalOpen(false)} className="absolute top-4 right-4 text-slate-400">✕</button>
                    
                    <h3 className="text-base font-black text-slate-100 mb-4 flex items-center gap-2">
                      <i data-lucide="check-circle" className="w-5 h-5 text-emerald-400"></i>
                      <span>Buyurtmani Tasdiqlash</span>
                    </h3>

                    <form onSubmit={handleCompleteOrderSubmit} className="space-y-4">
                      <div>
                        <label className="text-[11px] font-bold text-slate-400 block mb-1">Yetkazib berish manzili</label>
                        <input
                          type="text"
                          value={checkoutAddress}
                          onChange={(e) => setCheckoutAddress(e.target.value)}
                          className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-white outline-none focus:border-amber-500"
                          required
                        />
                      </div>

                      <div>
                        <label className="text-[11px] font-bold text-slate-400 block mb-1">To'lov Usuli</label>
                        <select
                          value={checkoutPaymentMethod}
                          onChange={(e) => setCheckoutPaymentMethod(e.target.value)}
                          className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-white outline-none"
                        >
                          <option value="click">Click / Payme (Online)</option>
                          <option value="nasiya">0% Nasiya (3 oyga bo'lib to'lash)</option>
                          <option value="cash">Kuryerga Naqd yoki Karta orqali</option>
                        </select>
                      </div>

                      <div className="bg-slate-950 p-3.5 rounded-2xl border border-slate-800 text-xs space-y-1">
                        <div className="flex justify-between text-slate-400">
                          <span>Mahsulotlar soni:</span>
                          <span className="font-bold text-slate-200">{cart.reduce((a, c) => a + c.qty, 0)} dona</span>
                        </div>
                        <div className="flex justify-between text-slate-400">
                          <span>Yetkazib berish (Express):</span>
                          <span className="font-bold text-emerald-400">BEPUL 🚚</span>
                        </div>
                        <div className="flex justify-between text-amber-400 font-black pt-1 border-t border-slate-800 text-sm">
                          <span>Jami Summa:</span>
                          <span>{cart.reduce((a, c) => a + (c.price * c.qty), 0).toLocaleString()} so'm</span>
                        </div>
                      </div>

                      <button
                        type="submit"
                        className="w-full py-3 bg-gradient-to-r from-emerald-400 via-emerald-500 to-teal-500 text-slate-950 font-black text-xs rounded-xl shadow-lg"
                      >
                        Tasdiqlash va Telegram Botga Yuborish 📦
                      </button>
                    </form>
                  </div>
                </div>
              )}

              <div className="fixed bottom-0 left-0 right-0 z-40 bg-slate-900/95 backdrop-blur-md border-t border-slate-800 md:hidden flex justify-around items-center py-2 px-1 shadow-2xl">
                <button onClick={() => setActiveTab("shop")} className={`flex flex-col items-center gap-0.5 text-[10px] font-bold ${activeTab === 'shop' ? 'text-amber-400' : 'text-slate-400'}`}>
                  <i data-lucide="shopping-bag" className="w-5 h-5"></i>
                  <span>{t("shop")}</span>
                </button>
                <button onClick={() => setActiveTab("categories")} className={`flex flex-col items-center gap-0.5 text-[10px] font-bold ${activeTab === 'categories' ? 'text-amber-400' : 'text-slate-400'}`}>
                  <i data-lucide="grid" className="w-5 h-5"></i>
                  <span>{t("categories")}</span>
                </button>
                <button onClick={() => setActiveTab("wishlist")} className={`flex flex-col items-center gap-0.5 text-[10px] font-bold relative ${activeTab === 'wishlist' ? 'text-amber-400' : 'text-slate-400'}`}>
                  <i data-lucide="heart" className="w-5 h-5"></i>
                  <span>{t("favorites")}</span>
                  {wishlist.length > 0 && (
                    <span className="absolute -top-1 right-2 bg-rose-500 text-white text-[8px] w-3.5 h-3.5 rounded-full flex items-center justify-center font-black">
                      {wishlist.length}
                    </span>
                  )}
                </button>
                <button onClick={() => setActiveTab("stats")} className={`flex flex-col items-center gap-0.5 text-[10px] font-bold ${activeTab === 'stats' ? 'text-amber-400' : 'text-slate-400'}`}>
                  <i data-lucide="bar-chart-3" className="w-5 h-5"></i>
                  <span>{t("statsNav")}</span>
                </button>
                <button onClick={() => setActiveTab("profile")} className={`flex flex-col items-center gap-0.5 text-[10px] font-bold ${activeTab === 'profile' ? 'text-amber-400' : 'text-slate-400'}`}>
                  <i data-lucide="user" className="w-5 h-5"></i>
                  <span>{t("profile")}</span>
                </button>
              </div>

            </div>
          );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
